name: CentralOperacionalApp
options:
  bundleIdPrefix: com.pedidoprime
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  CentralOperacionalApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CentralOperacionalApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedidoprime.centraloperacional
        DEVELOPMENT_LANGUAGE: pt-BR
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Central Operacional"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: CentralOperacionalApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: pt-BR
