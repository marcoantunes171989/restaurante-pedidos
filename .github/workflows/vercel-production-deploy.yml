name: Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA exato da main aprovado para producao"
        required: true
        type: string
      confirmation:
        description: "Digite DEPLOY-PROD para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pedido-prime-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate release authorization
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DEPLOY-PROD" ]]; then
            echo "Production confirmation is invalid."
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must contain exactly 40 lowercase hexadecimal characters."
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Requested SHA: $RELEASE_SHA"
          echo "Current main:  $ACTUAL_SHA"

          if [[ "$RELEASE_SHA" != "$ACTUAL_SHA" ]]; then
            echo "The approved SHA does not match the current main HEAD."
            exit 1
          fi

      - name: Validate production configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          required_vars=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
          )

          for variable in "${required_vars[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured for production."
              exit 1
            fi
          done

          echo "Required production configuration is present."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://unit-test.invalid
          VITE_SUPABASE_ANON_KEY: unit-test-anon-key

      - name: Build production artifact
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy approved release to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.5.0 --prod --yes --token="$VERCEL_TOKEN"
