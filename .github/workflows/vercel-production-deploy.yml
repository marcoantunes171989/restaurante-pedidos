name: Vercel Production Deploy

run-name: Production release ${{ inputs.release_sha }} / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA exato de homologacao aprovado para producao"
        required: true
        type: string
      base_sha:
        description: "SHA de main congelado no instante da promocao"
        required: true
        type: string
      confirmation:
        description: "Digite DEPLOY-PROD para confirmar"
        required: true
        type: string
      request_id:
        description: "Identificador server-side da release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pedido-prime-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, test, build and fast-forward main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout approved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Fetch main and homologacao
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main homologacao

      - name: Validate release authorization and frozen SHAs
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DEPLOY-PROD" ]]; then
            echo "Production confirmation is invalid."
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must contain exactly 40 lowercase hexadecimal characters."
            exit 1
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "base_sha must contain exactly 40 lowercase hexadecimal characters."
            exit 1
          fi

          if [[ -z "$REQUEST_ID" ]]; then
            echo "request_id is required."
            exit 1
          fi

          if [[ ! "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "request_id format is invalid."
            exit 1
          fi

          if [[ "$RELEASE_SHA" == "$BASE_SHA" ]]; then
            echo "release_sha must differ from base_sha."
            exit 1
          fi

          CURRENT_MAIN="$(git rev-parse --verify origin/main)"
          CURRENT_HML="$(git rev-parse --verify origin/homologacao)"
          CHECKED_OUT="$(git rev-parse HEAD)"

          echo "request_id:    $REQUEST_ID"
          echo "release_sha:   $RELEASE_SHA"
          echo "base_sha:      $BASE_SHA"
          echo "origin/main:   $CURRENT_MAIN"
          echo "origin/hml:    $CURRENT_HML"
          echo "checked out:   $CHECKED_OUT"

          if [[ "$CHECKED_OUT" != "$RELEASE_SHA" ]]; then
            echo "Checked out commit is not the approved release_sha."
            exit 1
          fi

          if [[ "$CURRENT_MAIN" != "$BASE_SHA" ]]; then
            echo "origin/main does not match the frozen base_sha."
            exit 1
          fi

          if [[ "$CURRENT_HML" != "$RELEASE_SHA" ]]; then
            echo "origin/homologacao does not match the approved release_sha."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$CURRENT_MAIN" "$RELEASE_SHA"; then
            echo "origin/main is not an ancestor of release_sha."
            exit 1
          fi

          AHEAD="$(git rev-list --count "${CURRENT_MAIN}..${RELEASE_SHA}")"
          BEHIND="$(git rev-list --count "${RELEASE_SHA}..${CURRENT_MAIN}")"

          echo "ahead:  $AHEAD"
          echo "behind: $BEHIND"

          if [[ "$AHEAD" -le 0 ]]; then
            echo "Release is not ahead of main."
            exit 1
          fi

          if [[ "$BEHIND" -ne 0 ]]; then
            echo "Release is behind main."
            exit 1
          fi

      - name: Validate production configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
          )

          for variable in "${required_vars[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured for production."
              exit 1
            fi
          done

          echo "Required production configuration is present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://unit-test.invalid
          VITE_SUPABASE_ANON_KEY: unit-test-anon-key

      - name: Build production artifact
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Revalidate branches before push
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main homologacao

          CURRENT_MAIN="$(git rev-parse --verify origin/main)"
          CURRENT_HML="$(git rev-parse --verify origin/homologacao)"

          echo "origin/main: $CURRENT_MAIN"
          echo "origin/hml:  $CURRENT_HML"

          if [[ "$CURRENT_MAIN" != "$BASE_SHA" ]]; then
            echo "main changed during tests/build. Promotion aborted."
            exit 1
          fi

          if [[ "$CURRENT_HML" != "$RELEASE_SHA" ]]; then
            echo "homologacao changed during tests/build. Promotion aborted."
            exit 1
          fi

      - name: Fast-forward main to approved release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git push origin "${RELEASE_SHA}:refs/heads/main"
